version: '3.8'

services:
  # База данных PostgreSQL
  postgres:
    image: postgres:13
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.56.10:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-external-labels: "service=postgres,stack=myapp"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  # Очередь сообщений RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.56.10:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-external-labels: "service=rabbitmq,stack=myapp"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - backend

  # Сервис сессий (порт 8081)
  session-service:
    image: nieshays/session-service:do9
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.56.10:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-external-labels: "service=session-service,stack=myapp"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users_db
    networks:
      - backend
    depends_on:
      - postgres

  # Сервис отелей (порт 8082)
  hotel-service:
    image: nieshays/hotel-service:latest
    ports:
      - "8082:8082"
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.56.10:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-external-labels: "service=hotel-service,stack=myapp"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hotels_db
    networks:
      - backend
    depends_on:
      - postgres

  # Сервис бронирований (порт 8083)
  booking-service:
    image: nieshays/booking-service:do9
    ports:
      - "8083:8083"
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.56.10:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-external-labels: "service=booking-service,stack=myapp"
    environment:
      SPRING_APPLICATION_NAME: booking-service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reservations_db
      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      RABBIT_MQ_USER: guest
      RABBIT_MQ_PASSWORD: guest
      RABBIT_MQ_QUEUE_NAME: messagequeue
      RABBIT_MQ_EXCHANGE: messagequeue-exchange
      HOTEL_SERVICE_HOST: hotel-service
      HOTEL_SERVICE_PORT: 8082
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 8084
      LOYALTY_SERVICE_HOST: loyalty-service
      LOYALTY_SERVICE_PORT: 8085
    networks:
      - backend
    depends_on:
      - postgres
      - rabbitmq
      - hotel-service
      - payment-service
      - loyalty-service

  # Сервис платежей (порт 8084)
  payment-service:
    image: nieshays/payment-service:latest
    ports:
      - "8084:8084"
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.56.10:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-external-labels: "service=payment-service,stack=myapp"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payments_db
    networks:
      - backend
    depends_on:
      - postgres

  # Сервис лояльности (порт 8085)
  loyalty-service:
    image: nieshays/loyalty-service:latest
    ports:
      - "8085:8085"
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.56.10:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-external-labels: "service=loyalty-service,stack=myapp"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: balances_db
    networks:
      - backend
    depends_on:
      - postgres

  # Сервис отчетов (порт 8086)
  report-service:
    image: nieshays/report-service:do9
    ports:
      - "8086:8086"
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.56.10:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-external-labels: "service=report-service,stack=myapp"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: statistics_db
      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      RABBIT_MQ_USER: guest
      RABBIT_MQ_PASSWORD: guest
      RABBIT_MQ_QUEUE_NAME: messagequeue
      RABBIT_MQ_EXCHANGE: messagequeue-exchange
    networks:
      - backend
    depends_on:
      - postgres
      - rabbitmq

  # Gateway сервис
  gateway-service:
    image: nieshays/gateway-service:do9
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.56.10:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-external-labels: "service=gateway-service,stack=myapp"
    environment:
      SESSION_SERVICE_HOST: session-service
      SESSION_SERVICE_PORT: 8081
      HOTEL_SERVICE_HOST: hotel-service
      HOTEL_SERVICE_PORT: 8082
      BOOKING_SERVICE_HOST: booking-service
      BOOKING_SERVICE_PORT: 8083
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 8084
      LOYALTY_SERVICE_HOST: loyalty-service
      LOYALTY_SERVICE_PORT: 8085
      REPORT_SERVICE_HOST: report-service
      REPORT_SERVICE_PORT: 8086
    networks:
      - backend
    depends_on:
      - session-service
      - hotel-service
      - booking-service
      - payment-service
      - loyalty-service
      - report-service

  # NGINX прокси
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "8081:8081"
      - "8087:8087"
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.56.10:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-external-labels: "service=nginx,stack=myapp"
    networks:
      - backend
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-service
      - session-service

volumes:
  postgres_data:

networks:
  backend:
    driver: overlay
    attachable: true