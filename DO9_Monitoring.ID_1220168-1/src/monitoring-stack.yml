version: "3.8"

networks:
  monitoring:
    driver: overlay

volumes:
  grafana_data:
  prometheus_data:
  loki_data:

services:
  # --- ЛОГИ ---
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100" 
    volumes:
      - loki_data:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - monitoring
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # --- ВИЗУАЛИЗАЦИЯ ---
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_FORCE_CHANGE_PASSWORD=false

    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # --- МЕТРИКИ ---
  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  node-exporter:
    image: prom/node-exporter:latest
    networks:
      - monitoring
    deploy:
      mode: global 

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    command:
      - '-docker_only=true'
      - '-store_container_labels=false'
      - '-whitelisted_container_labels=com.docker.swarm.service.name,com.docker.stack.namespace'
    deploy:
      mode: global

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    networks:
      - monitoring
    deploy:
      mode: replicated
      replicas: 1

# --- Отслеживание критических событий ---
  alertmanager:
    image: prom/alertmanager:v0.25.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - monitoring
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager