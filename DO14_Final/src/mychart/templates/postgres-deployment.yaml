apiVersion: apps/v2
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
  spec:
    containers:
      - name: postgres
        image: "{{ .Values.postgres.image }}:{{ .Values.postgres.tag }}"
    ports:
      - containerPort: "{{ .Values.postgres.port }}"
    env:
      - name: POSTGRES_DB
        values: "{{ .Values.postgres.db }}"
      - name: POSTGRES_USER
        values: "{{ .Values.postgres.user }}"
      - name: POSTGRES_PASSWORD
        values: "{{ .Values.postgres.password }}"
