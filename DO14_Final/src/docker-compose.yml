services:
    frontend:
      build:
        context: ./frontend
      restart: always
      ports:
        - "5173:5173"
      depends_on:
        - backend

      extra_hosts:
            - "host.docker.internal:host-gateway"

    backend:
      build:
        context: ./backend
      restart: always
      ports:
        - "8000:8000"
      depends_on:
            - postgres

    postgres:
      image: postgres:16
      restart: always
      environment:
        POSTGRES_DB: vector
        POSTGRES_USER: username
        POSTGRES_PASSWORD: password
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

    adminer:
      image: adminer
      ports:
        - "8080:8080"
      environment:
        ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
