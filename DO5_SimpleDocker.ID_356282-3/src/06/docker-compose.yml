version: '3.8'

services:
  my-app:
    build: ./
    networks:
      - app-network

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:8080"  # Хост:80 → Контейнер:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - my-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge