version: '3.8'

services:
  # Главный сервис Portainer (запускается только на менеджере)
  portainer:
    image: portainer/portainer-ce:latest
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9443:9443"
    networks:
      - portainer_agent_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - "node.role == manager"

  # Агент Portainer (запускается на ВСЕХ узлах кластера для сбора данных)
  agent:
    image: portainer/agent:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - portainer_agent_network
    deploy:
      mode: global
      restart_policy:
        condition: any

networks:
  portainer_agent_network:
    driver: overlay
    attachable: true

volumes:
  portainer_data:
    driver: local