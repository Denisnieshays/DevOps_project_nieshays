apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loyalty-service
  template:
    metadata:
      labels:
        app: loyalty-service
    spec:
      containers:
      - name: loyalty-service
        image: nieshays/loyalty-service:latest   
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: GATEWAY_SERVICE_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: GATEWAY_SERVICE_HOST
        - name: GATEWAY_SERVICE_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: GATEWAY_SERVICE_PORT
        - name: GATEWAY_UUID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: GATEWAY_UUID
        ports:
        - containerPort: 8085 
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-service
spec:
  selector:
    app: loyalty-service
  ports:
  - port: 8085
    targetPort: 8085